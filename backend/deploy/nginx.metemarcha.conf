# Site definitivo: API somente em HTTPS, challenge HTTP para renovação.
limit_req_zone $binary_remote_addr zone=metemarcha_auth:10m rate=10r/m;

server {
    listen 80;
    server_name __MM_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/metemarcha-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __MM_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__MM_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MM_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    limit_req_status 429;

    location /v1/auth/ {
        limit_req zone=metemarcha_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:__MM_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:__MM_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
